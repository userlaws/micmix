# Deploys site/ to GitHub Pages on every push to main that touches the site.
# The site's canonical URL, base path and download link are injected from the repository, so nothing is hard-coded.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'package.json'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - name: Read app version
        id: app
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build site
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          VITE_BASE: ${{ steps.pages.outputs.base_path }}
          VITE_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/latest/download/MicMix-Setup.exe
          VITE_RELEASES_URL: https://github.com/${{ github.repository }}/releases
          VITE_APP_VERSION: ${{ steps.app.outputs.version }}
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
